version: '3.8'

services:
  # MySQL Database Service
  mysql-db:
    image: mysql:8.0.33
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: data
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Spring Boot Backend Service
  backend-app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql-db
    environment:
      # These override your application.properties dynamically in Docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/data?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      # Pass the mail password dynamically so it isn't hardcoded
      SPRING_MAIL_PASSWORD: your_new_gmail_app_password 

volumes:
  db_data:
